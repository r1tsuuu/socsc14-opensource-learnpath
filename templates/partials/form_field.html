<div class="form-field{% if field.errors %} form-field-error{% endif %}">
  {% if field.field.widget.input_type == "radio" %}
  <fieldset>
    <legend>{{ field.label }}</legend>
    {% for choice in field %}
    <label class="choice">{{ choice.tag }} {{ choice.choice_label }}</label>
    {% endfor %}
  </fieldset>
  {% else %}
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% endif %}
  {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
</div>
